<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Yoan Duclaux</title>
<meta name="description" content="Articles SEO, Google Ads et Meta Ads par Yoan Duclaux, consultant SEO &amp; SEA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root { --accent:#F5B82E; --accent-strong:#C8971F; --bg:#F3EFE6; --card:#FFFFFF; --radius:22px; --pill:999px; --font-display:'Space Grotesk', sans-serif; }
  body { margin:0; font-family:'Manrope', system-ui, sans-serif; color:#141414; background:var(--bg); -webkit-font-smoothing:antialiased; }
  a { color:#141414; text-decoration:none; }
  header { position:sticky; top:0; z-index:50; background:rgba(243,239,230,0.82); backdrop-filter:blur(14px); border-bottom:1px solid rgba(20,20,20,0.08); }
  nav { max-width:1240px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:9px; }
  .logo-mark { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background:#141414; color:var(--accent); border-radius:9px; font-family:var(--font-display); font-weight:700; font-size:17px; }
  .logo-name { font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-0.02em; }
  main { max-width:1240px; margin:0 auto; padding:56px 32px 88px; }
  h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(34px,5.6vw,64px); line-height:1.02; letter-spacing:-0.03em; margin:0; }
  .lede { max-width:58ch; margin:20px 0 0; font-size:17px; line-height:1.6; color:#5A564C; }
  .filters { display:flex; flex-wrap:wrap; gap:9px; margin:36px 0 32px; }
  .filters a { font-weight:700; font-size:14px; padding:9px 18px; border-radius:var(--pill); border:1.5px solid rgba(20,20,20,0.18); }
  .filters a.active { background:#141414; color:var(--bg); border-color:#141414; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px) { .grid { grid-template-columns:1fr; } }
  .post-card { background:var(--card); border:1px solid rgba(20,20,20,0.1); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; }
  .post-cover { height:150px; background:repeating-linear-gradient(135deg,#EEE9DC 0 12px,#E7E1D2 12px 24px); background-size:cover; background-position:center; }
  .post-body { padding:22px; display:flex; flex-direction:column; flex:1; }
  .post-tag { display:inline-flex; align-self:flex-start; font-family:var(--font-display); font-weight:700; font-size:12px; background:#141414; color:var(--accent); padding:6px 12px; border-radius:var(--pill); margin-bottom:12px; }
  .post-title { font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; margin:0; }
  .post-excerpt { font-size:13.5px; line-height:1.55; color:#6E6A60; margin:9px 0 16px; flex:1; }
  .post-date { font-size:12.5px; color:#A39D8C; font-weight:600; }
  .empty { padding:60px 0; text-align:center; color:#8A8578; font-weight:600; }
  footer { background:#141414; color:var(--bg); padding:32px; text-align:center; font-size:13px; }
  footer a { color:var(--bg); }
</style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="../index.html">
        <span class="logo-mark">Y</span>
        <span class="logo-name">Yoan Duclaux<span style="color:var(--accent);">.</span></span>
      </a>
      <div style="display:flex;align-items:center;gap:24px;font-weight:600;font-size:15px;">
        <a href="../index.html">Accueil</a>
        <a href="../index.html#projets">Projets</a>
        <a href="./index.html">Blog</a>
      </div>
    </nav>
  </header>

  <main>
    <div style="font-size:12.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#8A8578;margin-bottom:16px;">Blog</div>
    <h1>SEO, Ads &amp; stratégie digitale</h1>
    <p class="lede">Réflexions, guides et retours d'expérience sur le référencement naturel, Google Ads et Meta Ads.</p>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">Aucun article pour le moment.</div>
  </main>

  <footer>© 2026 Yoan Duclaux. <a href="mailto:Yoan.tavel@gmail.com">Yoan.tavel@gmail.com</a></footer>

<script type="module">
  import { supabase } from './supabase-client.js';

  const params = new URLSearchParams(location.search);
  const activeCat = params.get('cat') || '';

  const [{ data: categories }, { data: posts }] = await Promise.all([
    supabase.from('blog_categories').select('id,name,slug').order('name'),
    supabase
      .from('blog_posts')
      .select('title,slug,excerpt,cover_image,published_at,category_id,blog_categories(name,slug)')
      .eq('status', 'published')
      .order('published_at', { ascending: false })
  ]);

  const filtersEl = document.getElementById('filters');
  const all = document.createElement('a');
  all.textContent = 'Tous';
  all.href = './index.html';
  if (!activeCat) all.className = 'active';
  filtersEl.appendChild(all);
  (categories || []).forEach((c) => {
    const a = document.createElement('a');
    a.textContent = c.name;
    a.href = './index.html?cat=' + encodeURIComponent(c.slug);
    if (activeCat === c.slug) a.className = 'active';
    filtersEl.appendChild(a);
  });

  const filtered = (posts || []).filter((p) => !activeCat || (p.blog_categories && p.blog_categories.slug === activeCat));

  const gridEl = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  if (!filtered.length) {
    emptyEl.style.display = 'block';
  } else {
    filtered.forEach((p) => {
      const card = document.createElement('a');
      card.href = './post.html?slug=' + encodeURIComponent(p.slug);
      card.className = 'post-card';
      const cover = document.createElement('div');
      cover.className = 'post-cover';
      if (p.cover_image) cover.style.backgroundImage = `url('${p.cover_image}')`;
      const body = document.createElement('div');
      body.className = 'post-body';
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = p.blog_categories ? p.blog_categories.name : 'Blog';
      const title = document.createElement('h3');
      title.className = 'post-title';
      title.textContent = p.title;
      const excerpt = document.createElement('p');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = p.excerpt || '';
      const date = document.createElement('div');
      date.className = 'post-date';
      date.textContent = p.published_at ? new Date(p.published_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) : '';
      body.append(tag, title, excerpt, date);
      card.append(cover, body);
      gridEl.appendChild(card);
    });
  }
</script>
</body>
</html>
